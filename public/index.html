<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dividend Date Detective</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🕵️ Dividend Date Detective</h1>
  <p>
    Enter a stock you hold to compare its potential capital gains against its
    potential dividend income before the next ex-dividend date.
  </p>

  <form id="analyze-form">
    <div class="field">
      <label for="stock-symbol">Stock symbol</label>
      <input
        type="text"
        id="stock-symbol"
        name="stockSymbol"
        placeholder="e.g. ITC"
        autocomplete="off"
        required
      />
    </div>
    <div class="field">
      <label for="buy-price">Buy price (₹)</label>
      <input
        type="number"
        id="buy-price"
        name="buyPrice"
        placeholder="e.g. 350"
        min="0"
        step="0.01"
        autocomplete="off"
        required
      />
    </div>
    <div class="field">
      <label for="quantity">Quantity</label>
      <input
        type="number"
        id="quantity"
        name="quantity"
        placeholder="e.g. 100"
        min="1"
        step="1"
        autocomplete="off"
        required
      />
    </div>
    <button type="submit" id="analyze-btn">Analyze</button>
  </form>

  <button type="button" id="demo-btn">🎬 Demo Mode (sample data)</button>

  <div id="status" class="status" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text">Working...</span>
  </div>

  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
